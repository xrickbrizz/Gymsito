<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <title>Gymsito — Gym Tracker</title>
  <style>
    :root{
      --bg:#09090a;
      --bg2:#0d0d0f;
      --panel:#151518;
      --panel2:#1b1b20;
      --panel3:#222229;
      --line:#2e2e35;
      --line2:#3b3b45;
      --text:#f8f5ed;
      --muted:#aaa7a0;
      --muted2:#7f7d77;
      --gold:#e0bb55;
      --gold2:#f4d77d;
      --gold3:#8a6a24;
      --green:#62c890;
      --red:#ef756d;
      --shadow:0 18px 48px rgba(0,0,0,.38);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;
      min-height:100%;
      background:radial-gradient(circle at 78% -4%,rgba(224,187,85,.12),transparent 28%),linear-gradient(180deg,#080809,#0c0c0f 55%,#080809);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      letter-spacing:.01em;
      -webkit-font-smoothing:antialiased;
    }
    button,input,textarea,select{font:inherit}
    button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:disabled{opacity:.5;cursor:not-allowed}
    input,textarea,select{color:var(--text)}
    ::selection{background:rgba(224,187,85,.3)}
    .app{width:min(760px,100%);margin:auto;min-height:100dvh;padding:18px 14px calc(118px + env(safe-area-inset-bottom));}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand{font-weight:900;letter-spacing:.08em;font-size:18px}.brand b{color:var(--gold)}
    .date{font-size:12px;color:var(--muted);text-transform:capitalize}
    .back{width:42px;height:42px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:22px}
    .top-title{flex:1;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:900}
    .spacer{width:42px}
    .card{background:linear-gradient(145deg,#18181b,#121214);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:12px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
    .hero{background:linear-gradient(145deg,#282316,#161512 66%,#121214);border-color:#5a4925;overflow:hidden;position:relative}
    .hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-60px;top:-80px;background:radial-gradient(circle,rgba(244,215,125,.16),transparent 66%);pointer-events:none}
    .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}
    h1,h2,h3,p{margin-top:0}h1{font-size:34px;line-height:1.04;margin:5px 0 7px}h2{font-size:20px;line-height:1.15;margin:5px 0 8px}h3{font-size:16px;margin:0}
    .subtitle{color:#dbd7ce;margin:0 0 16px;line-height:1.4}
    .muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted2)}
    .primary,.secondary,.danger,.ghost{width:100%;min-height:50px;border-radius:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;transition:transform .16s ease,filter .16s ease,background .16s ease}
    .primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241d0a;box-shadow:0 8px 26px rgba(224,187,85,.18)}
    .secondary{background:var(--panel3);color:var(--text);border:1px solid var(--line2)}
    .ghost{background:transparent;color:var(--gold);border:1px solid #5a4b29}
    .danger{background:#311918;color:#ffb4ae;border:1px solid #713733}
    .primary:active,.secondary:active,.ghost:active,.danger:active,.list-card:active,.day-chip:active{transform:scale(.985)}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .metric{background:#1a1a1e;border:1px solid #26262d;border-radius:15px;padding:13px;min-width:0}
    .metric span{display:block;color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.11em;font-weight:800}.metric b{display:block;font-size:19px;line-height:1.1;margin:5px 0 2px}.metric small{font-size:10px;color:var(--muted)}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
    .section-title b{font-size:15px}.section-title .tiny{font-size:10px}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#2b2517;border:1px solid #66532a;color:var(--gold2);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;text-transform:uppercase;white-space:nowrap}
    .pill.green{background:#14271e;border-color:#2d6b4f;color:#81d7aa}.pill.red{background:#2a1716;border-color:#633330;color:#ffaca4}.pill.gray{background:#242429;border-color:#3a3a42;color:#bbb8af}
    .quick-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}
    .day-chip{background:#242426;color:#a9a69f;border:1px solid #35353c;border-radius:13px;padding:12px 6px;font-weight:850;font-size:11px}
    .day-chip.selected{background:var(--gold);border-color:var(--gold);color:#231d0b}
    .list-card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px;background:#17171a;border:1px solid #2a2a30;border-radius:16px;color:inherit;text-align:left;margin-bottom:9px}
    .list-card strong{display:block}.list-card small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}.list-card .tag{flex:none}.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:#2b2518;border:1px solid #5f4e29;color:var(--gold2);font-weight:900;font-size:10px;padding:6px 8px}
    .tag.day1,.tag.day3{background:#2b2518;color:var(--gold2)}.tag.day2,.tag.day4{background:#17221b;color:#86d9a8;border-color:#355e48}
    .empty{padding:32px 14px;text-align:center;color:var(--muted);border:1px dashed #35353b;border-radius:16px;background:#111114}
    .notice{display:flex;align-items:flex-start;gap:9px;background:#17171a;border:1px solid #2f2f36;border-radius:15px;padding:12px;font-size:12px;line-height:1.45;color:#cbc8c0}
    .notice .ico{color:var(--gold);font-weight:900}
    .progress-line{height:9px;background:#29292f;border-radius:99px;overflow:hidden;border:1px solid #37373f}.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
    .session-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.session-head .meta{text-align:right}.session-head .meta strong{font-size:12px}.session-head .meta small{display:block;color:var(--muted);margin-top:3px}
    .exercise-card{padding:15px}.exercise-num{display:flex;justify-content:space-between;align-items:center;gap:8px}.exercise-title{font-size:18px;margin:3px 0}.exercise-unit{font-size:10px;color:var(--muted)}
    .last-box{margin:11px 0;background:#101013;border:1px solid #2c2c32;border-left:3px solid var(--gold);padding:11px;border-radius:12px}.last-box .last-title{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-weight:900}.last-sets{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}.set-chip{background:#1d1d22;border:1px solid #30303a;border-radius:8px;padding:6px 8px;font-size:12px}.set-chip b{color:#fff}
    .sets-label{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-top:13px}
    .series-row{display:grid;grid-template-columns:30px 1fr 1fr 38px;gap:7px;align-items:center;margin:8px 0}.series-label{font-weight:900;color:var(--muted);font-size:11px}.input-wrap{background:#232328;border:1px solid #3a3a43;border-radius:12px;padding:6px 9px}.input-wrap small{font-size:9px;color:var(--muted2);display:block}.input-wrap input{width:100%;border:0;outline:0;background:transparent;font-size:17px;padding:1px 0;min-width:0}.remove{height:38px;width:38px;border-radius:10px;background:#2d1a19;color:#ff9d96;border:1px solid #58302d;font-size:19px}.add-set{width:100%;background:#17171a;color:var(--gold);border:1px dashed #5a4a29;border-radius:12px;padding:11px 10px;font-size:12px;font-weight:900;margin-top:4px}
    .note{width:100%;min-height:46px;background:#111114;border:1px solid #34343c;border-radius:12px;padding:11px;color:#ddd9d0;resize:vertical;margin-top:10px;outline:none}.note:focus,.input-wrap:focus-within{border-color:#7b652d;box-shadow:0 0 0 2px rgba(224,187,85,.08)}
    .sticky{position:sticky;bottom:79px;z-index:3;padding-top:9px;background:linear-gradient(180deg,transparent,#0a0a0b 25%)}
    .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px}.month-nav{display:flex;gap:8px}.month-nav button{width:42px;height:42px;border-radius:12px;background:#242427;color:#fff;border:1px solid #38383f;font-size:20px}.month-title{text-align:center;font-weight:900;text-transform:capitalize}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.calendar-head{font-size:9px;color:var(--muted2);padding:6px 0;text-align:center;font-weight:900}.cal-day{min-height:62px;background:#17171a;border:1px solid #27272d;border-radius:12px;padding:6px 4px;font-size:11px;position:relative}.cal-day.today{outline:2px solid #735d2a}.cal-day.empty{background:transparent;border-color:transparent}.cal-day .num{font-weight:900}.cal-day .session-btn{display:flex;width:100%;justify-content:center;margin-top:4px;border-radius:7px;padding:3px 2px;font-size:9px;font-weight:900;background:#2b2518;border:1px solid #554729;color:var(--gold2)}.cal-day .session-btn.pull{background:#17231c;border-color:#31523f;color:#8ddcb0}.cal-more{font-size:8px;color:var(--muted2);text-align:center;margin-top:3px}
    .chart-wrap{overflow:hidden}.chart-controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.seg{background:#232329;color:var(--muted);border:1px solid #383840;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:900}.seg.active{background:var(--gold);color:#20190b;border-color:var(--gold)}
    .chart{height:174px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid #3b3b40;padding:14px 6px 0;overflow-x:auto}.bar-col{height:100%;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.bar{width:22px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--gold2),var(--gold3));min-height:5px}.bar-label{font-size:8px;color:var(--muted2);white-space:nowrap}.bar-value{font-size:8px;color:#ddd9d0;white-space:nowrap}
    .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.record{border-color:#6b5728;background:linear-gradient(145deg,#2a2416,#1a1915)}.record .record-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.record .record-type{color:var(--gold);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.record .record-name{font-weight:900;margin-top:5px}.record .record-value{font-size:18px;color:var(--gold2);font-weight:950;margin-top:3px}
    .detail-series{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.detail-series .set-chip{background:#232329}
    .list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2b2b31}.list-row:last-child{border-bottom:0}
    .bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(15,15,17,.95);border-top:1px solid #2c2c32;backdrop-filter:blur(16px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
    .nav-inner{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.nav-item{background:transparent;color:var(--muted);font-size:9px;font-weight:900;padding:4px 2px;border-radius:12px}.nav-item.active{color:var(--gold)}.nav-ico{display:block;font-size:18px;line-height:1;margin-bottom:4px}
    .toast{position:fixed;z-index:50;left:50%;bottom:96px;transform:translateX(-50%);background:#efcf74;color:#251e0d;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:calc(100% - 28px);text-align:center}
    .modal{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:14px}.modal-box{width:min(760px,100%);background:#18181b;border:1px solid #404048;border-radius:22px;padding:19px;box-shadow:var(--shadow)}.modal-box h3{margin:5px 0 7px;font-size:20px}.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1}
    .success-icon{width:82px;height:82px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#f7de93,#9f7723);font-size:40px;box-shadow:0 0 0 8px rgba(224,187,85,.14),0 0 40px rgba(224,187,85,.16)}.success{text-align:center;padding:26px 16px 20px}.success h1{font-size:30px}.divider{height:1px;background:#2a2a30;margin:13px 0}
    .settings-grid{display:grid;gap:9px}.setting-card{padding:14px;background:#17171a;border:1px solid #292930;border-radius:16px}.setting-card strong{display:block;margin-bottom:4px}.setting-actions{display:grid;gap:9px;margin-top:9px}
    .small-select{background:#222228;color:#fff;border:1px solid #3a3a43;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:800;outline:0}.inline-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .top-progress{margin:10px 0 2px}.top-progress-row{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted)}
    .hide{display:none!important}
    @media (min-width:700px){.app{padding-top:34px}.metrics{gap:12px}.card{padding:19px}.calendar-grid{gap:7px}.cal-day{min-height:75px}}
    @media (max-width:410px){.series-row{grid-template-columns:25px 1fr 1fr 34px}.input-wrap{padding:6px 7px}.input-wrap input{font-size:16px}.metric b{font-size:17px}.quick-days{gap:6px}}
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <nav class="bottom-nav"><div id="nav" class="nav-inner"></div></nav>
  <input id="import-file" class="hide" type="file" accept="application/json">

  <script>
  'use strict';

  const STORAGE_KEY = 'gym-tracker-v1';
  const DATA_VERSION = 2;

  const routine = {
    1:{group:'Pecho · Hombros · Tríceps',short:'Pecho · Hombros · Tríceps',ids:['day1_press_bench','day1_incline_dumbbell','day1_dumbbell_fly','day1_military_press','day1_lateral_raise','day1_french_press','day1_triceps_bar_extension','day1_unilateral_cable_extension']},
    2:{group:'Espalda · Bíceps',short:'Espalda · Bíceps',ids:['day2_lat_pulldown','day2_machine_row','day2_barbell_row','day2_face_pull','day2_preacher_curl','day2_hammer_curl','day2_low_cable_curl']},
    3:{group:'Pecho · Hombros · Tríceps',short:'Pecho · Hombros · Tríceps',ids:['day1_press_bench','day1_incline_dumbbell','day1_dumbbell_fly','day1_military_press','day1_lateral_raise','day1_french_press','day1_triceps_bar_extension','day1_unilateral_cable_extension']},
    4:{group:'Espalda · Bíceps',short:'Espalda · Bíceps',ids:['day2_lat_pulldown','day2_machine_row','day2_barbell_row','day2_face_pull','day2_preacher_curl','day2_hammer_curl','day2_low_cable_curl']}
  };

  const exercises = {
    day1_press_bench:['Press plano con barra','barra'],
    day1_incline_dumbbell:['Press inclinado con mancuernas','mancuerna'],
    day1_dumbbell_fly:['Apertura con mancuernas','mancuerna'],
    day1_military_press:['Press militar','barra'],
    day1_lateral_raise:['Vuelo lateral','mancuerna'],
    day1_french_press:['Press francés con barra romana','barra'],
    day1_triceps_bar_extension:['Extensión de tríceps con barra','barra'],
    day1_unilateral_cable_extension:['Extensión unilateral de tríceps en polea baja','cable'],
    day2_lat_pulldown:['Jalón al pecho prono','cable'],
    day2_machine_row:['Remo sentado en máquina','máquina'],
    day2_barbell_row:['Remo con barra libre','barra'],
    day2_face_pull:['Face pull','cable'],
    day2_preacher_curl:['Bíceps en predicador','máquina'],
    day2_hammer_curl:['Curl martillo','mancuerna'],
    day2_low_cable_curl:['Curl de bíceps en polea baja','cable']
  };

  const DAY_NAMES = {1:'Pecho · Hombros · Tríceps',2:'Espalda · Bíceps',3:'Pecho · Hombros · Tríceps',4:'Espalda · Bíceps'};
  const NAV = [['home','⌂','Inicio'],['train','◉','Entrenar'],['calendar','□','Calendario'],['progress','↗','Progreso'],['settings','⚙','Ajustes']];

  let state = loadState();
  let view = 'home';
  let selectedId = null;
  let selectedExerciseId = null;
  let calendarDate = new Date();
  let exerciseMetric = 'weight';

  function uid(){
    try{return crypto.randomUUID();}catch{return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}
  }
  function blankState(){return {version:DATA_VERSION,sessions:[],draft:null,settings:{}}}
  function safeClone(x){return typeof structuredClone==='function'?structuredClone(x):JSON.parse(JSON.stringify(x))}

  function normalizeNumber(value){
    const raw=String(value??'').trim().replace(',', '.');
    if(raw==='') return null;
    const num=Number(raw);
    return Number.isFinite(num)?num:null;
  }
  function fmt(value){
    return new Intl.NumberFormat('es-AR',{maximumFractionDigits:1}).format(Number(value)||0);
  }
  function formatDate(date, options={day:'numeric',month:'short'}){
    return new Intl.DateTimeFormat('es-AR',options).format(typeof date==='string'?parseLocalDate(date):date);
  }
  function parseLocalDate(s){
    if(s instanceof Date) return new Date(s.getTime());
    const [y,m,d]=String(s).split('-').map(Number);
    return new Date(y||1970,(m||1)-1,d||1);
  }
  function localISO(date=new Date()){
    const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  function todayLabel(){return formatDate(new Date(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
  function esc(text=''){
    return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function dayClass(day){return day%2===0?'day2':'day1'}
  function equipmentUnit(id){
    const kind=exercises[id]?.[1];
    if(kind==='mancuerna') return 'kg por mancuerna';
    if(kind==='barra') return 'kg totales';
    return 'kg';
  }
  function volumeForSet(exerciseId,set){
    const w=normalizeNumber(set.weight)||0, r=normalizeNumber(set.reps)||0;
    const kind=exercises[exerciseId]?.[1];
    const multiplier=kind==='mancuerna'?2:1;
    return w*r*multiplier;
  }
  function volumeForExercise(ex){return (ex?.series||[]).reduce((sum,set)=>sum+volumeForSet(ex.exerciseId,set),0)}
  function statsForSession(session){
    const exerciseRows=(session?.exercises||[]);
    const performed=exerciseRows.filter(e=>(e.series||[]).some(s=>normalizeNumber(s.weight)!==null&&normalizeNumber(s.reps)!==null));
    const series=performed.reduce((a,e)=>a+e.series.filter(s=>normalizeNumber(s.weight)!==null&&normalizeNumber(s.reps)!==null).length,0);
    const reps=performed.reduce((a,e)=>a+e.series.reduce((x,s)=>x+(normalizeNumber(s.reps)||0),0),0);
    const vol=performed.reduce((a,e)=>a+volumeForExercise(e),0);
    return {exercises:performed.length,series,reps,vol};
  }
  function durationMinutes(session){return Number(session?.durationMinutes)||0}
  function completedSessions(){return state.sessions.filter(s=>Number.isFinite(Number(s.completedAt))&&Number(s.completedAt)>0)}
  function orderedSessionsDesc(){return completedSessions().slice().sort((a,b)=>Number(b.completedAt)-Number(a.completedAt))}
  function lastCompleted(){return orderedSessionsDesc()[0]||null}
  function nextDay(){const last=lastCompleted();return last?((Number(last.dayType)%4)+1):1}

  function normalizeSession(session){
    const s={
      id:String(session?.id||uid()),
      date:/^\d{4}-\d{2}-\d{2}$/.test(session?.date)?session.date:localISO(),
      dayType:[1,2,3,4].includes(Number(session?.dayType))?Number(session.dayType):1,
      startedAt:Number(session?.startedAt||0),
      completedAt:Number(session?.completedAt||session?.metadata?.completedAt||0),
      durationMinutes:Number(session?.durationMinutes??session?.metadata?.durationMinutes??0)||0,
      notes:String(session?.notes||''),
      exercises:[]
    };
    const rows=Array.isArray(session?.exercises)?session.exercises:[];
    const ids=routine[s.dayType].ids;
    const byId=new Map(rows.map(e=>[e?.exerciseId,e]));
    ids.forEach(id=>{
      const old=byId.get(id);
      const series=Array.isArray(old?.series)?old.series.map(z=>({id:String(z?.id||uid()),weight:z?.weight??'',reps:z?.reps??''})):[];
      s.exercises.push({exerciseId:id,name:exercises[id][0],note:String(old?.note||''),series});
    });
    return s;
  }

  function normalizeDraft(draft){
    if(!draft)return null;
    const d=normalizeSession(draft);
    d.startedAt=Number(draft.startedAt||d.startedAt||Date.now());
    d.editingId=draft.editingId||null;
    d.sourceCompletedAt=Number(draft.sourceCompletedAt||draft.completedAt||0);
    return d;
  }

  function migrateLoaded(raw){
    if(!raw||typeof raw!=='object')return blankState();
    const base=blankState();
    const sessions=Array.isArray(raw.sessions)?raw.sessions.map(normalizeSession):[];
    const draft=raw.draft?normalizeDraft(raw.draft):null;
    return {version:DATA_VERSION,sessions,draft,settings:(raw.settings&&typeof raw.settings==='object')?raw.settings:{}};
  }

  function loadState(){
    try{
      const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      const migrated=migrateLoaded(raw);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
      return migrated;
    }catch{
      return blankState();
    }
  }
  function saveState(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
    catch{toast('No se pudieron guardar los datos en este navegador.');}
  }

  function validNumberText(value,{allowZero=true,integer=false}={}){
    const raw=String(value??'').trim().replace(',','.');
    if(raw==='')return {empty:true,value:null};
    const re=integer?/^\d+$/:/^\d+(?:\.\d+)?$/;
    if(!re.test(raw))return {error:integer?'Usa un número entero.':'Usa un número válido, por ejemplo 22,5.'};
    const num=Number(raw);
    if(!Number.isFinite(num)||num<0||(!allowZero&&num===0))return {error:'El valor debe ser válido y no negativo.'};
    return {value:num};
  }

  function validateDraft(draft){
    let hasAny=false;
    for(const ex of draft.exercises){
      for(const set of ex.series){
        const w=validNumberText(set.weight),r=validNumberText(set.reps,{integer:true});
        if(w.empty&&r.empty)continue;
        if(w.error)return `${ex.name}: ${w.error}`;
        if(r.error)return `${ex.name}: ${r.error}`;
        if(w.empty||r.empty)return `${ex.name}: completa peso y repeticiones en la misma serie.`;
        hasAny=true;
      }
    }
    if(!hasAny)return 'Registra al menos una serie antes de guardar el entrenamiento.';
    return null;
  }

  function createBlankExercises(day){
    return routine[day].ids.map(exerciseId=>({
      exerciseId,
      name:exercises[exerciseId][0],
      note:'',
      series:[1,2,3].map(()=>({id:uid(),weight:'',reps:''}))
    }));
  }

  function createNewDraft(day){
    state.draft={id:uid(),date:localISO(),dayType:day,notes:'',startedAt:Date.now(),completedAt:0,durationMinutes:0,editingId:null,sourceCompletedAt:0,exercises:createBlankExercises(day)};
    saveState();
    view='workout';selectedId=null;selectedExerciseId=null;render();
  }

  function requestStart(day){
    if(state.draft){
      if(state.draft.editingId){
        showModal('Hay una edición en curso','Primero guarda o cancela la edición actual antes de comenzar un nuevo entrenamiento.',()=>{},'Entendido',false);
        return;
      }
      showModal('Ya tienes un entrenamiento en progreso','Puedes continuar con la sesión guardada o descartarla y comenzar una nueva.',()=>{state.draft=null;saveState();createNewDraft(day)},'Comenzar nuevo',true,'Continuar en curso',()=>{view='workout';selectedId=null;selectedExerciseId=null;render()});
      return;
    }
    createNewDraft(day);
  }

  function editSession(id){
    const session=state.sessions.find(s=>s.id===id); if(!session)return;
    if(state.draft){
      if(state.draft.editingId===id){view='workout';render();return;}
      showModal('Hay una sesión abierta','Primero termina o descarta la sesión en curso antes de editar un entrenamiento histórico.',()=>{state.draft=null;saveState();editSession(id)},'Descartar y editar',true,'Cancelar');
      return;
    }
    state.draft=safeClone(session);
    state.draft.editingId=session.id;
    state.draft.sourceCompletedAt=session.completedAt;
    saveState();view='workout';render();
  }

  function discardDraft(){
    showModal('¿Descartar esta sesión?','El registro en progreso se eliminará y no podrás recuperarlo.',()=>{state.draft=null;saveState();go('home')},'Descartar',true);
  }

  function finishWorkout(){
    const d=state.draft;if(!d)return;
    const error=validateDraft(d);if(error){toast(error);return;}

    // Eliminar series completamente vacías, conservar la estructura de ejercicios.
    d.exercises=d.exercises.map(ex=>({...ex,series:ex.series.filter(s=>{const w=String(s.weight??'').trim(),r=String(s.reps??'').trim();return w!==''||r!==''})}));

    if(d.editingId){
      const idx=state.sessions.findIndex(s=>s.id===d.editingId);
      if(idx<0){toast('No se encontró la sesión que estabas editando.');return;}
      const old=state.sessions[idx];
      const updated={
        ...d,
        id:old.id,
        date:old.date,
        startedAt:old.startedAt,
        completedAt:old.completedAt,
        durationMinutes:old.durationMinutes,
        editingId:undefined,
        sourceCompletedAt:undefined
      };
      delete updated.editingId;delete updated.sourceCompletedAt;
      state.sessions[idx]=normalizeSession(updated);
      state.draft=null;saveState();selectedId=old.id;view='detail';render();toast('Cambios guardados');
      return;
    }

    const now=Date.now();
    const completed={...normalizeSession(d),completedAt:now,durationMinutes:d.durationMinutes||Math.max(1,Math.round((now-(d.startedAt||now))/60000)),startedAt:d.startedAt||now};
    state.sessions.push(completed);
    state.draft=null;saveState();selectedId=completed.id;view='success';render();
  }

  function updateSet(ei,si,key,value){
    if(!state.draft?.exercises[ei]?.series[si])return;
    state.draft.exercises[ei].series[si][key]=value;saveState();
  }
  function updateExerciseNote(ei,value){if(!state.draft)return;state.draft.exercises[ei].note=value;saveState()}
  function updateDraftNote(value){if(!state.draft)return;state.draft.notes=value;saveState()}
  function addSet(ei){if(!state.draft)return;state.draft.exercises[ei].series.push({id:uid(),weight:'',reps:''});saveState();render()}
  function removeSet(ei,si){if(!state.draft)return;const sets=state.draft.exercises[ei].series;if(sets.length<=1){toast('Cada ejercicio debe conservar al menos una fila.');return}sets.splice(si,1);saveState();render()}

  function previousExerciseSession(exerciseId,excludeId=null){
    return orderedSessionsDesc().find(s=>s.id!==excludeId&&(s.exercises||[]).some(e=>e.exerciseId===exerciseId&&e.series.some(z=>validNumberText(z.weight).value!==null&&validNumberText(z.reps,{integer:true}).value!==null)))||null;
  }
  function exerciseRow(session,id){return session?.exercises?.find(e=>e.exerciseId===id)||null}

  function exerciseRecords(id){
    const rows=completedSessions().map(s=>({s,e:exerciseRow(s,id)})).filter(x=>x.e&&x.e.series.some(z=>validNumberText(z.weight).value!==null&&validNumberText(z.reps,{integer:true}).value!==null)).sort((a,b)=>Number(b.s.completedAt)-Number(a.s.completedAt));
    const sets=rows.flatMap(({s,e})=>e.series.map(z=>({s,e,z,weight:normalizeNumber(z.weight)||0,reps:normalizeNumber(z.reps)||0,volume:volumeForSet(id,z)}))).filter(x=>x.weight>=0&&x.reps>=0);
    const bestWeight=sets.reduce((best,x)=>!best||x.weight>best.weight||(x.weight===best.weight&&x.reps>best.reps)?x:best,null);
    const bestReps=sets.reduce((best,x)=>!best||x.reps>best.reps||(x.reps===best.reps&&x.weight>best.weight)?x:best,null);
    const bestVolumeSession=rows.reduce((best,x)=>!best||volumeForExercise(x.e)>volumeForExercise(best.e)?x:best,null);
    return {rows,sets,bestWeight,bestReps,bestVolumeSession};
  }

  function newRecordsForSession(session){
    const out=[];
    for(const ex of session.exercises||[]){
      const validSets=ex.series.filter(z=>validNumberText(z.weight).value!==null&&validNumberText(z.reps,{integer:true}).value!==null);
      if(!validSets.length)continue;
      const beforeRows=completedSessions().filter(s=>s.id!==session.id).map(s=>({s,e:exerciseRow(s,ex.exerciseId)})).filter(x=>x.e&&x.e.series.some(z=>validNumberText(z.weight).value!==null&&validNumberText(z.reps,{integer:true}).value!==null));
      const beforeSets=beforeRows.flatMap(({s,e})=>e.series.map(z=>({weight:normalizeNumber(z.weight)||0,reps:normalizeNumber(z.reps)||0})).filter(z=>validNumberText(z.weight).value!==null&&validNumberText(z.reps,{integer:true}).value!==null));
      const curWeight=Math.max(...validSets.map(z=>normalizeNumber(z.weight)||0));
      const curReps=Math.max(...validSets.map(z=>normalizeNumber(z.reps)||0));
      const curVolume=volumeForExercise(ex);
      const oldWeight=beforeSets.length?Math.max(...beforeSets.map(z=>z.weight)):-Infinity;
      const oldReps=beforeSets.length?Math.max(...beforeSets.map(z=>z.reps)):-Infinity;
      const oldVolume=beforeRows.length?Math.max(...beforeRows.map(x=>volumeForExercise(x.e))):-Infinity;
      const types=[];
      if(curWeight>oldWeight)types.push('Peso');
      if(curReps>oldReps)types.push('Reps');
      if(curVolume>oldVolume)types.push('Volumen');
      if(types.length)out.push({exerciseId:ex.exerciseId,name:ex.name,types,weight:validSets.reduce((best,z)=>!best||Number(normalizeNumber(z.weight)||0)>Number(normalizeNumber(best.weight)||0)||(Number(normalizeNumber(z.weight)||0)===Number(normalizeNumber(best.weight)||0)&&Number(normalizeNumber(z.reps)||0)>Number(normalizeNumber(best.reps)||0))?z:best,null),volume:curVolume});
    }
    return out;
  }

  function workout(){
    const s=state.draft;if(!s)return train();
    const completedSets=s.exercises.reduce((a,e)=>a+e.series.filter(z=>String(z.weight).trim()!==''||String(z.reps).trim()!=='').length,0);
    const expected=s.exercises.length*3;
    const pct=Math.min(100,Math.round(completedSets/expected*100));
    return `${header(s.editingId?'Editar sesión':'Sesión activa')}
      <div class="card hero">
        <div class="session-head"><div><div class="eyebrow">Día ${s.dayType}${s.editingId?' · edición histórica':''}</div><h2>${DAY_NAMES[s.dayType]}</h2><p class="muted">${s.editingId?'La fecha y duración originales se conservan.':'Se guarda automáticamente. 3 series por ejercicio por defecto.'}</p></div><span class="tag ${dayClass(s.dayType)}">D${s.dayType}</span></div>

      ${s.notes?`<div class="card"><div class="eyebrow">Nota general</div><p style="white-space:pre-wrap">${esc(s.notes)}</p></div>`:''}
      <div class="section-title"><b>Desglose por ejercicio</b><span class="tiny">Toca para ver historial</span></div>
      ${s.exercises.map(e=>`<button class="list-card" onclick="openExercise('${e.exerciseId}')"><div><strong>${esc(e.name)}</strong>${e.series.length?`<div class="detail-series">${e.series.filter(z=>String(z.weight).trim()!==''||String(z.reps).trim()!=='').map((z,i)=>`<span class="set-chip">S${i+1}: ${fmt(normalizeNumber(z.weight))} kg × ${fmt(normalizeNumber(z.reps))}</span>`).join('')}</div><small>Volumen: ${fmt(volumeForExercise(e))} kg</small>`:'<small>Sin series registradas</small>'}${e.note?`<small>📝 ${esc(e.note)}</small>`:''}</div><span class="tag">Historial</span></button>`).join('')}
      <button class="secondary" onclick="editSession('${s.id}')">Editar entrenamiento</button><div style="height:8px"></div><button class="danger" onclick="confirmDelete('${s.id}')">Eliminar entrenamiento</button>`;
  }

  function confirmDelete(id){
    const s=state.sessions.find(x=>x.id===id);if(!s)return;
    showModal('¿Eliminar este entrenamiento?',`Se eliminará el Día ${s.dayType} del ${formatDate(s.date,{day:'numeric',month:'long',year:'numeric'})}. Esta acción no se puede deshacer.`,()=>{state.sessions=state.sessions.filter(x=>x.id!==id);saveState();go('home')},'Eliminar',true);
  }

  function calendar(){
    const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;
    const byDate={};completedSessions().forEach(s=>{(byDate[s.date]??=[]).push(s)});Object.values(byDate).forEach(list=>list.sort((a,b)=>a.completedAt-b.completedAt));
    const cells=[];for(let i=0;i<start;i++)cells.push('<div class="cal-day empty"></div>');
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,list=byDate[ds]||[],today=ds===localISO();
      cells.push(`<div class="cal-day ${today?'today':''}"><div class="num">${d}</div>${list.slice(0,2).map(s=>`<button class="session-btn ${s.dayType%2===0?'pull':''}" onclick="openSession('${s.id}')">D${s.dayType}</button>`).join('')}${list.length>2?`<div class="cal-more">+${list.length-2} más</div>`:''}</div>`);
    }
    return `${header('Calendario',false)}
      <div class="card"><div class="calendar-toolbar"><div class="month-nav"><button onclick="changeMonth(-1)" aria-label="Mes anterior">‹</button></div><div class="month-title">${esc(formatDate(first,{month:'long',year:'numeric'}))}</div><div class="month-nav"><button onclick="changeMonth(1)" aria-label="Mes siguiente">›</button></div></div><div class="calendar-grid">${['L','M','X','J','V','S','D'].map(x=>`<div class="calendar-head">${x}</div>`).join('')}${cells.join('')}</div></div>
      <div class="section-title"><b>Sesiones de este mes</b><span class="tiny">${Object.values(byDate).filter(list=>list.some(s=>{const dd=parseLocalDate(s.date);return dd.getFullYear()===y&&dd.getMonth()===m})).length} días con actividad</span></div>
      ${completedSessions().filter(s=>{const d=parseLocalDate(s.date);return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>b.completedAt-a.completedAt).map(sessionCard).join('')||'<div class="empty">No hay entrenamientos registrados en este mes.</div>'}`;
  }

  function weekStartDate(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
  function filterSessionsByDays(days){const now=new Date();now.setHours(0,0,0,0);const min=now.getTime()-(days-1)*86400000;return completedSessions().filter(s=>parseLocalDate(s.date).getTime()>=min)}

  function progress(){
    const sessions=completedSessions(),last7=filterSessionsByDays(7),last30=filterSessionsByDays(30),thisWeek=sessions.filter(s=>parseLocalDate(s.date)>=weekStartDate()),now=new Date(),thisMonth=sessions.filter(s=>{const d=parseLocalDate(s.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}),volTotal=sessions.reduce((a,s)=>a+statsForSession(s).vol,0),vol7=last7.reduce((a,s)=>a+statsForSession(s).vol,0),vol30=last30.reduce((a,s)=>a+statsForSession(s).vol,0),volMonth=thisMonth.reduce((a,s)=>a+statsForSession(s).vol,0),freq30=(last30.length/4.2857);
    const counts=[1,2,3,4].map(d=>sessions.filter(s=>s.dayType===d).length);
    const perWeek= freq30?freq30:0;
    return `${header('Progreso',false)}
      <div class="metrics"><div class="metric"><span>Total</span><b>${sessions.length}</b><small>entrenamientos</small></div><div class="metric"><span>Últimos 7 días</span><b>${last7.length}</b><small>${fmt(vol7)} kg</small></div><div class="metric"><span>Últimos 30 días</span><b>${last30.length}</b><small>${fmt(vol30)} kg</small></div></div>
      <div class="summary-grid"><div class="metric"><span>Volumen total</span><b>${fmt(volTotal)} kg</b><small>acumulado</small></div><div class="metric"><span>Este mes</span><b>${fmt(volMonth)} kg</b><small>${thisMonth.length} sesiones</small></div><div class="metric"><span>Esta semana</span><b>${fmt(thisWeek.reduce((a,s)=>a+statsForSession(s).vol,0))} kg</b><small>${thisWeek.length} sesiones</small></div><div class="metric"><span>Frecuencia 30d</span><b>${fmt(perWeek)}</b><small>sesiones / semana</small></div></div>
      <div class="section-title"><b>Distribución del ciclo</b><span class="tiny">Sesiones completadas</span></div><div class="card">${counts.map((count,i)=>`<div class="list-row"><div><strong>Día ${i+1}</strong><div class="tiny">${DAY_NAMES[i+1]}</div></div><div class="inline-controls"><span class="tiny">${count}</span><div style="width:92px"><div class="progress-line"><span style="width:${sessions.length?Math.round(count/Math.max(...counts,1)*100):0}%"></span></div></div></div></div>`).join('')}</div>
      <div class="section-title"><b>Volumen reciente</b><span class="tiny">Últimas 10 sesiones</span></div>${simpleSessionChart(sessions.slice().sort((a,b)=>a.completedAt-b.completedAt).slice(-10))}
      <div class="section-title"><b>Historial por ejercicio</b><span class="tiny">15 ejercicios</span></div>
      ${Object.keys(exercises).map(id=>{const r=exerciseRecords(id);return `<button class="list-card" onclick="openExercise('${id}')"><div><strong>${esc(exercises[id][0])}</strong><small>${r.rows.length?r.rows.length+' sesiones registradas · mejor peso '+fmt(r.bestWeight.weight)+' kg':'Sin registros todavía'}</small></div><span class="tag">Ver</span></button>`}).join('')}`;
  }

  function simpleSessionChart(sessions){
    if(!sessions.length)return '<div class="empty">Completa entrenamientos para ver tu evolución.</div>';
    const vals=sessions.map(s=>({s,v:statsForSession(s).vol})),max=Math.max(...vals.map(x=>x.v),1);
    return `<div class="card"><div class="chart">${vals.map(x=>`<div class="bar-col" title="${formatDate(x.s.date,{day:'numeric',month:'short'})} · ${fmt(x.v)} kg"><div class="bar-value">${fmt(x.v)}</div><div class="bar" style="height:${Math.max(6,x.v/max*100)}%"></div><div class="bar-label">D${x.s.dayType}</div></div>`).join('')}</div></div>`;
  }

  function exerciseView(){
    const id=selectedExerciseId;if(!exercises[id])return progress();
    const r=exerciseRecords(id),rows=r.rows.slice().reverse();
    const points=rows.map(({s,e})=>({s,e,value:exerciseMetric==='weight'?Math.max(...e.series.map(z=>normalizeNumber(z.weight)||0)):exerciseMetric==='reps'?Math.max(...e.series.map(z=>normalizeNumber(z.reps)||0)):volumeForExercise(e)}));
    const max=Math.max(...points.map(p=>p.value),1);
    return `${header('Historial de ejercicio')}
      <div class="card hero"><div class="eyebrow">Seguimiento individual</div><h2>${esc(exercises[id][0])}</h2><p class="muted">${esc(equipmentUnit(id))}. Cada punto representa la mejor métrica de esa sesión.</p><div class="chart-controls">${[['weight','Peso máximo'],['reps','Repeticiones'],['volume','Volumen']].map(([key,label])=>`<button class="seg ${exerciseMetric===key?'active':''}" onclick="setExerciseMetric('${key}')">${label}</button>`).join('')}</div><div class="chart-wrap"><div class="chart">${points.length?points.slice(-12).map(p=>`<div class="bar-col" title="${formatDate(p.s.date,{day:'numeric',month:'short',year:'numeric'})} · ${fmt(p.value)} ${exerciseMetric==='reps'?'reps':'kg'}"><div class="bar-value">${fmt(p.value)}</div><div class="bar" style="height:${Math.max(6,p.value/max*100)}%"></div><div class="bar-label">${formatDate(p.s.date,{day:'numeric',month:'short'})}</div></div>`).join(''):'<div class="muted">Aún no hay datos.</div>'}</div></div></div>
      <div class="summary-grid"><div class="metric"><span>Mejor peso</span><b>${r.bestWeight?fmt(r.bestWeight.weight)+' kg':'—'}</b><small>${r.bestWeight?r.bestWeight.reps+' reps':'sin datos'}</small></div><div class="metric"><span>Más reps</span><b>${r.bestReps?fmt(r.bestReps.reps):'—'}</b><small>${r.bestReps?r.bestReps.weight+' kg':'sin datos'}</small></div><div class="metric"><span>Mayor volumen</span><b>${r.bestVolumeSession?fmt(volumeForExercise(r.bestVolumeSession.e))+' kg':'—'}</b><small>${r.bestVolumeSession?formatDate(r.bestVolumeSession.s.date,{day:'numeric',month:'short',year:'numeric'}):'sin datos'}</small></div><div class="metric"><span>Sesiones</span><b>${r.rows.length}</b><small>con registros</small></div></div>
      <div class="section-title"><b>Historial completo</b><span class="tiny">${r.rows.length} sesiones</span></div>
      ${r.rows.map(({s,e})=>`<div class="card"><div class="session-head"><div><div class="eyebrow">${formatDate(s.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="tiny">Día ${s.dayType}</div></div><div class="meta"><strong>${fmt(volumeForExercise(e))} kg</strong><small>volumen</small></div></div><div class="detail-series">${e.series.filter(z=>normalizeNumber(z.weight)!==null&&normalizeNumber(z.reps)!==null).map((z,i)=>`<span class="set-chip">S${i+1}: ${fmt(normalizeNumber(z.weight))} kg × ${fmt(normalizeNumber(z.reps))}</span>`).join('')}</div>${e.note?`<div class="tiny" style="margin-top:8px">📝 ${esc(e.note)}</div>`:''}</div>`).join('')||'<div class="empty">Todavía no has realizado este ejercicio.</div>'}`;
  }

  function settings(){
    const size=Math.round(new Blob([JSON.stringify(state)]).size/1024);
    return `${header('Ajustes',false)}
      <div class="settings-grid">
        <div class="setting-card"><strong>Guardado local</strong><span class="tiny">Los datos se almacenan en este dispositivo mediante localStorage. Tamaño aproximado: ${size} KB.</span></div>
        <div class="setting-card"><strong>Secuencia actual</strong><span class="tiny">Última sesión: ${lastCompleted()?`Día ${lastCompleted().dayType}`:'ninguna'} · Próxima recomendada: Día ${nextDay()}.</span></div>
        <div class="setting-card"><strong>Respaldo de datos</strong><span class="tiny">Exporta una copia JSON para guardarla o transferirla a otro dispositivo. Importar reemplazará los datos actuales después de tu confirmación.</span><div class="setting-actions"><button class="secondary" onclick="exportData()">Exportar datos</button><button class="secondary" onclick="document.getElementById('import-file').click()">Importar copia</button></div></div>
        <div class="setting-card"><strong>Datos de la rutina</strong><span class="tiny">15 ejercicios · 4 días · 3 series por defecto. Se pueden agregar o quitar series solo en una sesión concreta.</span></div>
        <div class="setting-card"><strong>Zona de peligro</strong><span class="tiny">Borra todos los entrenamientos y la sesión en progreso de este navegador.</span><div class="setting-actions"><button class="danger" onclick="confirmReset()">Borrar todos los datos</button></div></div>
      </div>`;
  }

  function exportData(){
    const payload={...state,version:DATA_VERSION,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`gymsito-backup-${localISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia exportada correctamente.');
  }

  function validateImport(data){
    if(!data||typeof data!=='object')return 'El archivo no contiene un objeto válido.';
    if(!Array.isArray(data.sessions))return 'La copia debe contener una lista de sesiones.';
    for(const s of data.sessions){
      if(typeof s?.id!=='string')return 'Hay una sesión sin ID válido.';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return 'Hay una fecha de sesión inválida.';
      if(![1,2,3,4].includes(Number(s.dayType)))return 'Hay un Día de entrenamiento inválido.';
      if(!Array.isArray(s.exercises))return 'Una sesión no contiene ejercicios válidos.';
      for(const e of s.exercises){
        if(!exercises[e.exerciseId])return `Ejercicio desconocido: ${e.exerciseId}`;
        if(!Array.isArray(e.series))return 'Hay un ejercicio sin lista de series.';
        for(const z of e.series){
          const w=String(z.weight??'').trim(),r=String(z.reps??'').trim();
          if(w!==''&&validNumberText(w).error)return 'Existe un peso inválido en la copia.';
          if(r!==''&&validNumberText(r,{integer:true}).error)return 'Existen repeticiones inválidas en la copia.';
        }
      }
    }
    return null;
  }

  function confirmImport(data){
    const error=validateImport(data);if(error){toast(error);return;}
    showModal('¿Importar y reemplazar los datos?','Esta acción reemplazará los entrenamientos actuales del navegador por la copia seleccionada.',()=>{state=migrateLoaded(data);saveState();view='home';render();toast('Copia importada correctamente.')},'Importar',false);
  }

  function confirmReset(){
    showModal('¿Borrar todos los datos?','Se eliminarán todos los entrenamientos, notas y cualquier sesión en progreso. Esta acción no se puede deshacer.',()=>{state=blankState();saveState();view='home';render();toast('Todos los datos fueron borrados.')},'Borrar todo',true);
  }

  document.getElementById('import-file').addEventListener('change',async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{const data=JSON.parse(await file.text());confirmImport(data)}catch{toast('No se pudo leer el archivo JSON.')}finally{e.target.value='';}
  });

  function render(){
    if(view==='home')app().innerHTML=home();
    else if(view==='train')app().innerHTML=train();
    else if(view==='workout')app().innerHTML=workout();
    else if(view==='calendar')app().innerHTML=calendar();
    else if(view==='progress')app().innerHTML=progress();
    else if(view==='settings')app().innerHTML=settings();
    else if(view==='detail')app().innerHTML=detail();
    else if(view==='success')app().innerHTML=success();
    else if(view==='exercise')app().innerHTML=exerciseView();
    else view='home',app().innerHTML=home();
    nav();
  }

  // Exponer funciones usadas por atributos onclick.
  Object.assign(window,{go,requestStart,openSession,openExercise,changeMonth,setExerciseMetric,discardDraft,finishWorkout,updateSet,updateExerciseNote,updateDraftNote,addSet,removeSet,editSession,confirmDelete,confirmReset,exportData});

  // Migración y arranque.
  state=migrateLoaded(state);saveState();render();
  </script>
</body>
</html>
